name: guide-check
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  guide-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (pin from the C9 work)
        with:
          persist-credentials: false
      - run: python3 -I guide/_tools/check.py
