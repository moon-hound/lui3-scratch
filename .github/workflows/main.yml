name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - name: gate
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          case "$TITLE" in
            *FAILGATE*) echo "drill: gate fails on purpose"; exit 1 ;;
          esac
          echo "gate ok"
